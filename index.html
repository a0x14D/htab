<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>Hacker New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- developer-icons is a React package. These shims implement just the two
         React entry points it imports, so the icon set renders without React.
         Must appear before the first module script (icons.js). -->
    <script type="importmap">
        {
            "imports": {
                "react": "./vendor/react-shim.js",
                "react/jsx-runtime": "./vendor/jsx-runtime-shim.js"
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --accent: #3fb950;
            --accent-rgb: 63, 185, 80;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            background-image:
                radial-gradient(ellipse at 50% -10%, rgba(var(--accent-rgb), 0.14), transparent 55%),
                linear-gradient(rgba(var(--accent-rgb), 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--accent-rgb), 0.05) 1px, transparent 1px);
            background-size: auto, 44px 44px, 44px 44px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.07) 0px, rgba(0, 0, 0, 0.07) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
            z-index: 50;
        }
        ::selection { background: rgba(var(--accent-rgb), 0.4); }
        .terminal-glow { text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.45); }
        .accent-text { color: var(--accent); }

        /* Mode buttons */
        .mode-btn {
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            color: #c9d1d9;
            border-radius: 0.375rem;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .mode-btn:hover { background: rgba(var(--accent-rgb), 0.1); color: var(--accent); }
        .mode-btn.active { background: rgba(var(--accent-rgb), 0.15); border-color: var(--accent); color: var(--accent); }
        .mode-btn kbd {
            border: 1px solid rgba(var(--accent-rgb), 0.5);
            background: rgba(var(--accent-rgb), 0.1);
            color: var(--accent);
        }

        /* Link target toggle */
        .target-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.375rem 0.7rem;
            font-size: 0.75rem;
            border: 1px solid #30363d;
            border-radius: 0.375rem;
            color: #8b949e;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .target-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .target-toggle[aria-pressed="true"] {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(var(--accent-rgb), 0.1);
        }
        .target-toggle .target-icon { font-weight: 700; line-height: 1; }

        /* developer-icons: sized by CSS so one SVG works at any slot size.
           Component icons fall back to emoji if the CDN is unavailable. */
        .dev-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            flex: none;
        }
        .dev-icon svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        .dev-icon.dev-icon-menu {
            width: 1.125rem;
            height: 1.125rem;
        }
        @media (min-width: 640px) {
            .dev-icon:not(.dev-icon-menu) {
                width: 2rem;
                height: 2rem;
            }
        }
        /* Drop shadow keeps bright multi-colour logos legible on the dark tiles. */
        .dev-icon svg {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
        }

        /* Search bar */
        .search-shell {
            /* Don't rely on Tailwind's `relative` for dropdown anchoring —
               the command menu is absolutely positioned against this box. */
            position: relative;
            border: 1px solid #30363d;
            background: rgba(22, 27, 34, 0.85);
            border-radius: 0.5rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .search-shell:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.2), 0 0 24px -10px rgba(var(--accent-rgb), 0.7);
        }
        .search-input { background: transparent; }
        .search-input::placeholder { color: #6e7681; }

        /* The $ prompt is decorative: it must not add height to the shell. */
        .search-prompt {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            padding-left: 1rem;
            font-weight: 700;
            pointer-events: none;
        }

        /* The scratchpad toggle is pinned to the shell's right edge. Setting
           position here (not via an ID rule) keeps it above Tailwind's
           `.hidden`-style utilities and out of the shell's flow. */
        .search-action {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            background: transparent;
            border: 0;
            cursor: pointer;
            color: #6e7681;
            transition: color 0.15s ease;
        }
        .search-action:hover,
        .search-action:focus-visible { color: var(--accent); outline: none; }

        /* Scratchpad toggle shows a dot when tasks are open.
           NOTE: do not set `position` on #notes-toggle itself — Tailwind's
           `.absolute` places the button, and an ID rule would out-specify
           the utility class and drop it back into normal flow. */
        #notes-toggle.has-todos::after {
            content: "";
            position: absolute;
            top: 0.6rem;
            right: 0.75rem;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 9999px;
            background: var(--accent);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.9);
            pointer-events: none;
        }

        /* Command dropdown */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            cursor: pointer;
            color: #c9d1d9;
            border-left: 2px solid transparent;
        }
        .menu-item:hover, .menu-item.selected {
            background: #161b22;
            color: var(--accent);
            border-left-color: var(--accent);
        }
        /* Keep long utility/pivot lists inside the viewport */
        #search-dropdown {
            max-height: min(24rem, 60vh);
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        /* Toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.5rem;
            transform: translate(-50%, 1rem);
            background: #161b22;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            letter-spacing: 0.02em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Floating Duck.ai launcher */
        .duck-btn {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.65rem 1rem;
            min-height: 2.75rem;
            /* Filled + accent so it reads as a button, not background chrome */
            background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.22), rgba(var(--accent-rgb), 0.1));
            border: 1px solid var(--accent);
            border-radius: 9999px;
            color: var(--accent);
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-family: inherit;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.15),
                        0 6px 22px -8px rgba(var(--accent-rgb), 0.7);
            transition: border-color 0.15s ease, color 0.15s ease,
                        box-shadow 0.15s ease, transform 0.15s ease,
                        opacity 0.3s ease, translate 0.3s ease;
            /* Draw the eye once, then settle */
            animation: duck-attract 2.6s ease-in-out 3;
        }
        .duck-btn:hover,
        .duck-btn:focus-visible {
            border-color: var(--accent);
            color: #0d1117;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.25),
                        0 8px 28px -8px rgba(var(--accent-rgb), 0.9);
            outline: none;
            transform: translateY(-2px);
            animation: none;
        }
        .duck-btn:active { transform: translateY(0) scale(0.97); }

        .duck-emoji {
            font-size: 1.15rem;
            line-height: 1;
            transition: transform 0.2s ease;
            animation: duck-bob 2.6s ease-in-out 3;
        }
        .duck-btn:hover .duck-emoji,
        .duck-btn:focus-visible .duck-emoji {
            transform: rotate(-14deg) scale(1.2);
            animation: none;
        }
        .duck-label { white-space: nowrap; }

        /* Gentle nudge so the launcher is noticed, then it rests. */
        @keyframes duck-attract {
            0%, 100% { transform: translateY(0); }
            8%       { transform: translateY(-6px); }
            16%      { transform: translateY(0); }
            24%      { transform: translateY(-4px); }
            32%      { transform: translateY(0); }
        }
        @keyframes duck-bob {
            0%, 100% { transform: rotate(0deg); }
            8%       { transform: rotate(-16deg); }
            16%      { transform: rotate(12deg); }
            24%      { transform: rotate(-8deg); }
            32%      { transform: rotate(0deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .duck-btn, .duck-emoji { animation: none; }
        }
        body.no-fx .duck-btn,
        body.no-fx .duck-emoji { animation: none; }

        /* Keep the label for screen readers on very narrow screens */
        @media (max-width: 380px) {
            .duck-label { display: none; }
            .duck-btn { padding: 0.75rem; min-width: 2.75rem; justify-content: center; }
        }
        /* Toast sits bottom-centre; nudge it so it never fights the duck. */
        @media (max-width: 640px) {
            .toast { bottom: 4.5rem; }
            .duck-btn { bottom: 1rem; right: 1rem; }
        }

        /* Quick links */
        .link-card {
            background: rgba(22, 27, 34, 0.6);
            border: 1px solid #21262d;
            border-radius: 0.5rem;
            transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }
        .link-card:hover {
            border-color: rgba(var(--accent-rgb), 0.55);
            background: rgba(22, 27, 34, 0.95);
            box-shadow: 0 12px 24px -16px rgba(var(--accent-rgb), 0.6);
            transform: translateY(-1px);
        }
        .link-card:hover .link-name { color: var(--accent); }

        /* Pin control */
        .pin-btn {
            position: absolute;
            top: 0.25rem;
            right: 0.25rem;
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            line-height: 1;
            color: #484f58;
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }
        .link-card:hover .pin-btn,
        .pin-btn:focus-visible {
            opacity: 1;
        }
        .pin-btn:hover { color: var(--accent); transform: scale(1.15); }
        /* Pinned links always show their star */
        .pin-btn.pinned { opacity: 1; color: var(--accent); }
        .link-card.pinned {
            border-color: rgba(var(--accent-rgb), 0.6);
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.18);
        }
        /* Keyboard/coarse-pointer users get an always-visible target */
        @media (hover: none) {
            .pin-btn { opacity: 0.7; }
        }

        /* Custom links removed with the ✕ on the tile */
        .link-del {
            position: absolute;
            top: 0.25rem;
            left: 0.25rem;
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.25rem;
            font-size: 0.7rem;
            line-height: 1;
            color: #484f58;
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }
        .link-card:hover .link-del,
        .link-del:focus-visible { opacity: 1; }
        .link-del:hover { color: #f85149; transform: scale(1.15); }
        .link-card.custom {
            border-style: dashed;
            border-color: rgba(var(--accent-rgb), 0.35);
        }
        @media (hover: none) {
            .link-del { opacity: 0.6; }
        }

        /* Drag to reorder */
        .link-card { cursor: grab; }
        .link-card:active { cursor: grabbing; }
        .link-card.dragging {
            opacity: 0.4;
            transform: scale(0.96);
            border-style: dashed;
            border-color: var(--accent);
        }
        .link-card[draggable="false"] { cursor: pointer; }

        /* Reduced-effects mode (:theme) */
        body.no-fx::before { display: none; }
        body.no-fx { background-image: none; }
        body.no-fx .terminal-glow { text-shadow: none; }

        /* Research dork chips */
        #dork-bar { display: none; flex-wrap: wrap; gap: 0.5rem; }
        #dork-bar.visible { display: flex; }
        .dork-chip {
            padding: 0.25rem 0.625rem;
            font-size: 0.75rem;
            border: 1px solid #30363d;
            border-radius: 0.375rem;
            color: #8b949e;
            transition: all 0.15s ease;
        }
        .dork-chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), 0.08); }

        /* Scratchpad */
        .scratchpad textarea {
            width: 100%;
            min-height: 7rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.875rem;
            resize: vertical;
        }
        .scratchpad textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.2);
        }
        .scratchpad textarea::placeholder { color: #484f58; }

        /* Scratchpad tabs */
        .scratchpad-tab {
            padding: 0.15rem 0.55rem;
            border: 1px solid #30363d;
            border-radius: 0.375rem;
            color: #8b949e;
            background: transparent;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }
        .scratchpad-tab:hover { color: #c9d1d9; border-color: #484f58; }
        .scratchpad-tab[aria-selected="true"] {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(var(--accent-rgb), 0.08);
        }

        /* Todo list */
        .todo-input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0.5rem;
            padding: 0.5rem 0.85rem;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.875rem;
        }
        .todo-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.2);
        }
        .todo-input::placeholder { color: #484f58; }

        .todo-add {
            flex: 0 0 auto;
            width: 2.25rem;
            height: 2.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #30363d;
            border-radius: 0.5rem;
            color: #8b949e;
            font-size: 1.1rem;
            line-height: 1;
            background: transparent;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }
        .todo-add:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(var(--accent-rgb), 0.08);
        }

        .todo-list { display: flex; flex-direction: column; gap: 0.25rem; }

        .todo-row {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            padding: 0.4rem 0.5rem;
            border: 1px solid transparent;
            border-radius: 0.375rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .todo-row:hover {
            background: rgba(var(--accent-rgb), 0.05);
            border-color: #21262d;
        }
        .todo-check {
            flex: 0 0 auto;
            width: 1.1rem;
            height: 1.1rem;
            margin-top: 0.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #484f58;
            border-radius: 0.25rem;
            color: #0d1117;
            font-size: 0.8rem;
            line-height: 1;
            cursor: pointer;
            background: transparent;
            transition: all 0.15s ease;
        }
        .todo-check:hover { border-color: var(--accent); }
        .todo-check[aria-checked="true"] {
            background: var(--accent);
            border-color: var(--accent);
        }
        .todo-text {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 0.875rem;
            color: #c9d1d9;
            word-break: break-word;
        }
        .todo-row.done .todo-text {
            color: #484f58;
            text-decoration: line-through;
        }
        .todo-del {
            flex: 0 0 auto;
            width: 1.4rem;
            height: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 0.25rem;
            background: transparent;
            color: #484f58;
            font-size: 0.85rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, color 0.15s ease;
        }
        .todo-row:hover .todo-del,
        .todo-del:focus-visible { opacity: 1; }
        .todo-del:hover { color: #f85149; }
        @media (hover: none) {
            .todo-del { opacity: 0.6; }
        }

        /* Page content: one centred column, or column + side rails on wide
           screens. The quote sits above it, directly under the header. */
        .content {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        /* Mode console — desktop-only widgets.
           ≥1280px: two cards in the left gutter, one in the right.
           640–1279px: a three-card strip under the tiles.
           <640px: hidden, so the phone layout is untouched. */
        .console-strip { display: none; }
        .console-rail { display: none; }
        .quote-card { display: none; }

        @media (min-width: 640px) {
            .quote-card {
                display: block;
                max-width: 46rem;
                /* Two lines' worth, so rotating quotes don't nudge the layout */
                min-height: 3.5rem;
                margin: 0.8rem 0 0;
            }
            .console-strip {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.75rem;
                align-items: stretch;
                /* Reserve the tallest mode's height so switching modes does
                   not jump the vertically-centred layout. */
                min-height: 8.75rem;
            }
        }

        @media (min-width: 1280px) {
            .content {
                display: grid;
                grid-template-columns: minmax(10rem, 18rem) 48rem minmax(10rem, 18rem);
                gap: 1.5rem;
                justify-content: center;
                align-content: center;
                align-items: start;
            }
            .content > main {
                grid-column: 2;
                padding-top: 0;
            }
            .console-strip { display: none; }
            .console-rail {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                width: 100%;
                max-width: 18rem;
                min-width: 0;
            }
            #console-left { grid-column: 1; justify-self: end; }
            #console-right { grid-column: 3; justify-self: start; }
        }

        .console-card {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
            padding: 0.7rem 0.8rem;
            border: 1px solid #21262d;
            border-radius: 0.6rem;
            background: rgba(22, 27, 34, 0.55);
            transition: border-color 0.15s ease;
        }
        .console-card:hover { border-color: #30363d; }
        .console-label {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: #6e7681;
        }
        .console-value {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--accent);
        }
        .console-sub {
            font-size: 0.68rem;
            line-height: 1.45;
            color: #6e7681;
            word-break: break-word;
        }
        .console-mono {
            font-family: inherit;
            font-size: 0.68rem;
            line-height: 1.45;
            color: #8b949e;
            word-break: break-all;
            text-align: left;
        }
        .console-input {
            width: 100%;
            min-width: 0;
            padding: 0.3rem 0.5rem;
            border: 1px solid #30363d;
            border-radius: 0.375rem;
            background: #0d1117;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.72rem;
        }
        .console-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.15);
        }
        .console-input::placeholder { color: #484f58; }
        .console-textarea {
            resize: none;
            min-height: 2.3rem;
        }
        /* The datetime picker inherits the dark theme, icon included. */
        .console-input[type="datetime-local"] { color-scheme: dark; }
        .console-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }
        .console-btn {
            padding: 0.18rem 0.45rem;
            border: 1px solid #30363d;
            border-radius: 0.375rem;
            background: transparent;
            color: #8b949e;
            font-family: inherit;
            font-size: 0.65rem;
            line-height: 1.4;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .console-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .console-bar {
            height: 4px;
            border-radius: 999px;
            background: #21262d;
            overflow: hidden;
        }
        .console-bar > span {
            display: block;
            width: 0;
            height: 100%;
            background: var(--accent);
            transition: width 0.4s ease;
        }
        .console-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }
        .console-chip {
            max-width: 100%;
            padding: 0.15rem 0.45rem;
            border: 1px solid #30363d;
            border-radius: 999px;
            background: transparent;
            color: #8b949e;
            font-family: inherit;
            font-size: 0.65rem;
            line-height: 1.4;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        .console-chip:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
        .console-out {
            display: block;
            width: 100%;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
        }
        .console-out:hover { color: var(--accent); }
        .console-keys,
        .console-formats {
            display: flex;
            flex-direction: column;
            gap: 0.18rem;
            font-size: 0.68rem;
            line-height: 1.45;
            color: #8b949e;
        }
        .console-keys kbd,
        .console-formats code {
            padding: 0 0.25rem;
            border: 1px solid #30363d;
            border-radius: 0.2rem;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 0.65rem;
        }

        /* Anime quote feed */
        .quote-card {
            margin: 0;
            padding-left: 0.9rem;
            border-left: 2px solid rgba(var(--accent-rgb), 0.5);
            transition: opacity 0.35s ease;
            margin-top: 11px;
        }
        .quote-card.fading { opacity: 0; }
        .quote-card blockquote {
            margin: 0;
            font-size: 0.82rem;
            font-style: italic;
            line-height: 1.55;
            color: #c9d1d9;
        }
        .quote-card figcaption {
            margin-top: 0.25rem;
            font-size: 0.68rem;
            color: #6e7681;
        }
        .quote-card figcaption::before { content: "— "; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col justify-between">
    <!-- Header & Mode Switcher -->
    <header class="flex flex-wrap justify-between items-center gap-3 border-b border-gray-800 pb-4">
        <div class="min-w-0">
            <h1 class="text-lg sm:text-xl font-bold accent-text terminal-glow truncate">&gt; root@firefox-newtab:~#</h1>
            <p class="text-xs text-gray-500 mt-1 hidden sm:block">
                SECURE_SESSION // PROFILE_ACCESS:
                <span id="current-mode-label" class="accent-text font-bold">PERSONAL</span>
            </p>
        </div>
        <div class="flex items-center justify-end gap-2 sm:gap-3 flex-wrap w-full sm:w-auto">
            <div id="mode-selector" class="flex gap-2 sm:gap-3 text-xs sm:text-sm flex-wrap justify-end">
                <button data-mode="personal" class="mode-btn px-2.5 sm:px-3 py-1.5 flex items-center gap-2">
                    <kbd class="px-1.5 py-px text-[10px] font-bold rounded">1</kbd>
                    Personal
                </button>
                <button data-mode="research" class="mode-btn px-2.5 sm:px-3 py-1.5 flex items-center gap-2">
                    <kbd class="px-1.5 py-px text-[10px] font-bold rounded">2</kbd>
                    Research
                </button>
                <button data-mode="dev" class="mode-btn px-2.5 sm:px-3 py-1.5 flex items-center gap-2">
                    <kbd class="px-1.5 py-px text-[10px] font-bold rounded">3</kbd>
                    Dev
                </button>
                <button data-mode="ctf" class="mode-btn px-2.5 sm:px-3 py-1.5 flex items-center gap-2">
                    <kbd class="px-1.5 py-px text-[10px] font-bold rounded">4</kbd>
                    CTF
                </button>
            </div>
            <button id="target-toggle" type="button" aria-pressed="false"
                    title="Links open in the current tab — click for a new tab"
                    class="target-toggle">
                <span id="target-toggle-icon" class="target-icon" aria-hidden="true">→</span>
                <span id="target-toggle-label" class="hidden sm:inline">Same tab</span>
            </button>
        </div>
    </header>

    <!-- Quiet-resolve anime quote: top-left, under the header -->
    <figure id="quote-card" class="quote-card" aria-live="off">
        <blockquote id="quote-text"></blockquote>
        <figcaption id="quote-author"></figcaption>
    </figure>

    <div id="content" class="content">
        <!-- Wide screens only: the console cards live in the page gutters -->
        <aside id="console-left" class="console-rail" aria-label="Mode console"></aside>

        <!-- Main Content -->
        <main class="max-w-3xl mx-auto w-full space-y-5 py-8">
        <!-- Command Bar -->
        <div class="search-shell relative">
            <span class="search-prompt accent-text" aria-hidden="true">$</span>
            <input type="text" id="search-input" autofocus autocomplete="off" spellcheck="false"
                   placeholder="Search, jump to a link, or @engine query..."
                   class="search-input w-full py-4 pl-10 pr-14 text-gray-200">
            <button id="notes-toggle" type="button" title="Scratchpad (n)" aria-label="Toggle scratchpad"
                    class="search-action">📝</button>
            <!-- Command dropdown -->
            <div id="search-dropdown" role="listbox" class="hidden absolute left-0 right-0 mt-2 bg-gray-900 border border-gray-700 rounded-lg shadow-xl overflow-hidden z-50"></div>
        </div>

        <!-- Research-only dork shortcuts -->
        <div id="dork-bar" aria-label="Search operators"></div>

        <!-- Per-mode scratchpad: todo list + raw notes -->
        <section id="scratchpad" class="scratchpad hidden">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs text-gray-500">// SCRATCHPAD · <span id="scratchpad-mode" class="accent-text">PERSONAL</span></h2>
                <div class="flex items-center gap-3">
                    <div id="scratchpad-tabs" role="tablist" class="flex items-center gap-1 text-xs">
                        <button id="tab-todos" type="button" role="tab" class="scratchpad-tab" aria-selected="true">checklist</button>
                        <button id="tab-notes" type="button" role="tab" class="scratchpad-tab" aria-selected="false">notes</button>
                    </div>
                    <button id="scratchpad-close" type="button" class="text-xs text-gray-500 hover:text-gray-300 transition">close (esc)</button>
                </div>
            </div>

            <div id="scratchpad-todos" role="tabpanel">
                <div class="flex items-center gap-2">
                    <input type="text" id="todo-input" autocomplete="off" spellcheck="false"
                           placeholder="Add a task — press Enter"
                           aria-label="Add a task"
                           class="todo-input w-full">
                    <button id="todo-add" type="button" class="todo-add" aria-label="Add task">+</button>
                </div>
                <div id="todo-progress" class="text-[11px] text-gray-500 mt-2 mb-2"></div>
                <ul id="todo-list" class="todo-list"></ul>
                <p id="todo-empty" class="text-xs text-gray-600 hidden">No tasks yet — add one above.</p>
            </div>

            <div id="scratchpad-notes" role="tabpanel" class="hidden">
                <textarea id="scratchpad-input" placeholder="Notes for this mode — saved locally, automatically."></textarea>
            </div>
        </section>

        <!-- Quick links -->
        <div id="links-container" class="grid grid-cols-3 sm:grid-cols-5 gap-3 sm:gap-4"></div>
        </main>

        <!-- Wide screens only: one card balances the right gutter -->
        <aside id="console-right" class="console-rail" aria-label="More mode widgets"></aside>

        <!-- Medium screens: a three-card strip under the tiles -->
        <section id="mode-console" class="console-strip" aria-label="Mode console"></section>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-600 pt-4">
        SECURE_PROFILE // <span class="accent-text">ONLINE</span> // <span id="clock">--:--:--</span>
        <span class="hidden sm:inline">// 1-4 modes · / search · n notes · q duck.ai</span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Floating Duck.ai launcher -->
    <button id="duck-btn" type="button" class="duck-btn"
            title="Chat with Duck.ai (d)" aria-label="Open Duck.ai chat">
        <span class="duck-emoji" aria-hidden="true">🦆</span>
        <span class="duck-label">duck.ai</span>
    </button>

    <!-- Icons load asynchronously (ES module + CDN). app.js listens for
         "devicons:ready" and swaps emoji for SVG where a mapping exists. -->
    <script type="module" src="icons.js"></script>
    <script src="app.js"></script>
</body>
</html>
